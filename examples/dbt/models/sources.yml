version: 2

sources:
  - name: bronze
    meta:
      plugin: delta_read
    tables:
      - name: orders_raw
        meta:
          delta_table_path: "{{ env_var('DDI_LAKE') }}/orders_raw"

models:
  - name: orders_stg
    # How ddi resumes after a rebuild, declared once, in dbt, next to the model.
    # These are the defaults; they are spelled out here to show where they live.
    meta:
      ddi_timestamp: _timestamp
      ddi_key: order_id

  # Not a pipeline: ddi never writes this table, and there is no such table to write.
  # It says what to push to a dashboard when orders_stg commits a batch, and it rides on
  # that model's commits. Publication is best-effort and strictly after the Delta commit,
  # so nothing here can affect what orders_stg wrote.
  - name: orders_live
    meta:
      ddi_publish: webpubsub    # opt in, and which backend
      ddi_publish_group: orders # the channel a browser subscribes to
