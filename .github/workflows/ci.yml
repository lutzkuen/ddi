name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Everything except the tests that need an object store listening; those are
      # `#[ignore]`d and run by the `object-store` job below.
      - run: cargo test --all-targets

  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The image was never built here, which is how a binary that could not start got
      # published: `docker build` does not execute what it copies, so the build stage
      # succeeded and the breakage waited for whoever first ran the container.
      #
      # The Dockerfile's own smoke test is what makes this job worth its minutes — building
      # alone would still have gone green. Between them, a glibc mismatch between the build
      # and runtime stages fails here rather than in somebody's deployment.
      - uses: docker/setup-buildx-action@v3
      # Downstream repos (e.g. dat_kafka_connect's dat-ddi/Dockerfile) pin DDI_REF to an
      # exact commit and otherwise rebuild this whole dependency tree from scratch on every
      # bump. Pushing here, tagged by SHA, gives them a pre-built image to pull instead.
      # PRs stay local-only: nothing to publish yet, and a fork PR's GITHUB_TOKEN can't
      # push to ghcr.io regardless.
      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=ddi:ci" >> "$GITHUB_OUTPUT"
          else
            echo "value=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Again from the outside, because the in-image RUN proves it starts during the build
      # and this proves it starts the way an operator will invoke it. On a push, this pulls
      # the image just published above — `docker run` fetches it implicitly.
      - run: docker run --rm ${{ steps.tag.outputs.value }} --version

  licenses:
    name: licence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ddi is Apache-2.0 and meant to stay commercially usable, which depends on every
      # transitive dependency too. A `cargo update` can change that silently; this makes
      # it a failed build instead.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  object-store:
    name: object storage (Azurite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Azurite is Microsoft's Azure Storage emulator and speaks the real Blob protocol,
      # so it exercises the paths a local filesystem cannot: object-store credentials,
      # and the absence of suffix range requests.
      - name: Start Azurite
        run: |
          npm install -g azurite
          azurite-blob --skipApiVersionCheck --silent \
            --location "${RUNNER_TEMP}/azurite" --blobPort 10000 --blobHost 127.0.0.1 &
          # A 403 is a healthy answer here: it means Azurite is listening and rejecting
          # the unsigned request. Plain curl exits 0 on any HTTP status, so connecting at
          # all is the signal.
          for _ in $(seq 1 30); do
            curl -s -o /dev/null "http://127.0.0.1:10000/devstoreaccount1?comp=list" && break
            sleep 1
          done
          curl -s -o /dev/null -w 'azurite responded: HTTP %{http_code}\n' \
            "http://127.0.0.1:10000/devstoreaccount1?comp=list"

      - name: Create container
        run: az storage container create --name lake --connection-string "UseDevelopmentStorage=true"

      - name: Streaming against object storage
        run: cargo test --test azure_object_store -- --ignored --nocapture

  dbt:
    name: dbt end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install --quiet dbt-core dbt-duckdb deltalake pyarrow pandas

      - run: cargo build --bin ddi

      # Vanilla jaffle shop with no hooks, rebuilding the same Delta table ddi streams
      # into. Asserts after every step that no order is missing and none is duplicated.
      - name: Run the demo
        env:
          PY: python
          DBT: dbt
          DDI: target/debug/ddi
        run: ./examples/dbt/run_demo.sh
