[package]
name = "delta-delta-ingest"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Lutz Künneke <lutz.kuenneke89@gmail.com>"]
description = "Exactly-once, append-only, stateless Delta-to-Delta streaming. No checkpoint directory, no changelog reconciliation, no cluster."
repository = "https://github.com/lutzkuen/ddi"
readme = "README.md"
keywords = ["delta", "deltalake", "streaming", "etl", "lakehouse"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "ddi"
path = "src/main.rs"

[lib]
name = "delta_delta_ingest"
path = "src/lib.rs"

[features]
default = []
# The Kafka source (docs/kafka-design.md). Off by default: it builds librdkafka from C and
# links the system's OpenSSL 3, which a Delta-only build has no use for. Its config is parsed
# and validated either way; a build without it holds every [[kafka.pipeline]] back by name.
kafka = ["dep:rdkafka", "dep:arrow-avro"]
# Faults the Kafka integration tests inject into a running `ddi` through DDI_TEST_FAULT
# (docs/kafka-design.md §9.2, src/kafka/fault.rs). Never in a release: without it every hook is
# an empty function.
fault-injection = ["kafka"]

[dependencies]
# Pinned exactly: delta-rs is 0.x and churns. All calls are isolated behind
# src/source/ and src/sink.rs so a bump touches a bounded surface (plan §5).
# `azure` pulls in the ADLS Gen2 / Blob object store and registers the abfss:// and az://
# handlers at load time. Storage backends are additive: adding "s3" or "gcs" here is all
# another cloud needs, since everything above this line addresses tables by URI.
deltalake = { version = "=0.32.4", features = ["datafusion", "azure"] }

# arrow / datafusion / parquet are NOT declared directly: deltalake re-exports the
# exact versions it was built against (deltalake::arrow, ::datafusion, ::parquet).
# Declaring them separately resolves a second, conflicting copy — the `links = "lzma"`
# collision. Always go through the re-exports.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json reads a number as `significand as f64 / 10^k`,
# which is one ULP off for the 16- and 17-digit spellings a double is written with whenever
# it needs them. ddi reads its own doubles back through serde_json — the publish payload
# (`Publisher::rows_to_json`) and Delta statistics (`stats::bound_of_stat`) — so the default
# sent a dashboard the wrong double and could draw an upsert window one ULP above its row.
# The feature applies to the whole tree, and only makes parsing more correct.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
bytesize = "1"

# Already in the tree beneath the object store; declared here so the Trino client can
# speak its HTTP protocol directly rather than taking a client dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# dbt's profiles.yml. serde_norway is the maintained fork of serde_yaml.
serde_norway = "0.9"

# HMAC-SHA256 and base64url, for the bearer token the Azure Web PubSub data plane
# authenticates with. Same argument as `reqwest` above: one protocol shape is a small amount
# of code to own rather than taking a vendor SDK, and signing a token — as opposed to
# verifying one — parses no attacker-controlled input.
#
# `sha2` and `base64` already resolve in the tree beneath datafusion and the object store;
# they are declared here anyway, because relying on another crate's feature set for our own
# signing is how a build breaks silently after an unrelated bump. `hmac` is the only new
# entry in the lockfile, and its own dependencies (digest, crypto-common, subtle) are all
# already present. `ring` would have cost nothing at all, but it is here only as a rustls
# internal and depending on it directly would couple our signing to the TLS stack's version.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# The `kafka` feature. librdkafka 2.12.1, built from source and linked statically:
# - `ssl` against the system's OpenSSL 3, which also brings SASL PLAIN and SCRAM; not `sasl`,
#   which means GSSAPI (Kerberos) through libsasl2 and nothing else;
# - `zstd` reuses the zstd-sys this tree already locks, built bundled; snappy and lz4 are
#   built into librdkafka, and gzip goes through libz-sys;
# - no `dynamic-linking`: rdkafka-sys requires librdkafka >= 2.12.1, which no distribution
#   ships.
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "libz", "ssl", "zstd", "tracing"], optional = true }
# The one direct arrow crate, and the exception to the rule above: pinned exactly to the arrow
# deltalake re-exports (58.4.0), so it resolves to that copy and not a second one. Default
# features off: they are codecs for Avro container files, which Kafka messages are not, and
# `xz` would bring back the `links = "lzma"` collision.
arrow-avro = { version = "=58.4.0", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util"] }
# The parity reference for the `kafka` feature's decoder (docs/kafka-design.md §5.3, §9.1): the
# apache-avro that kafka-delta-ingest decodes Schema Registry Avro with, through
# schema_registry_converter 4.10.0. Its tests write fixtures with it, an Avro implementation
# independent of the arrow-avro under test, and compare against what it reads. 0.21.0 is the
# version that converter locks; production kdi's own is an open inventory item (M-1), and
# moving to it is this one line. No default features: they are codecs for container files,
# and `xz` would bring back the `links = "lzma"` collision.
apache-avro = { version = "=0.21.0", default-features = false }
# The apache-avro that schema_registry_converter 3.1.0 decodes with, which is the one the
# production kafka-delta-ingest builds turn Confluent Avro into JSON with (M-1: 0.14.0 beside the
# direct 0.17.0). tests/avro_production_parity.rs compares its JSON with the 0.21.0 the parity
# matrices are written against.
apache-avro-014 = { package = "apache-avro", version = "=0.14.0", default-features = false }

# Debug builds link deltalake + datafusion + arrow into every test binary, and their
# debug info — not their code — is what makes those binaries enormous. Keeping full
# DWARF for dependencies costs gigabytes of link memory to describe internals nobody
# steps through. Trimming it is what lets the suite build on a small machine.
[profile.dev]
# Enough for a backtrace to name a file and line in *our* code.
debug = "line-tables-only"
# Leave debug info in the .o files instead of copying it into the binary.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# `cargo test` inherits from dev, so the same trim applies to every test binary.

[profile.release]
lto = "thin"
codegen-units = 1

# A release build for a machine that cannot afford the LTO step. Thin LTO with
# codegen-units = 1 is a single, very large, single-threaded link; this trades some
# runtime performance for a build that fits in a few GB.
#   cargo build --profile release-lean
[profile.release-lean]
inherits = "release"
lto = false
codegen-units = 16
