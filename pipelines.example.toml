# delta-delta-ingest — example configuration.
#
# Every value shown under [defaults] is the default; per-pipeline keys override it.

[defaults]
allowed_latency_secs      = 30       # poll interval once caught up
max_bytes_per_batch       = "256MB"  # input bytes per batch
max_files_per_batch       = 1000
max_output_rows_per_batch = 5000000  # guards unnest amplification
target_file_size          = "128MB"

# The three below are PROCESS-wide, unlike the five above them: they are shared by every
# pipeline in this file rather than applied to each. ([defaults] is the [runtime] table under
# another name, so do not add a second [runtime] heading here — TOML reads that as a
# duplicate key, not as a second table.)
#
# Where DataFusion writes what it cannot hold in memory. Unset it is the OS temporary
# directory, which inside a container is the writable layer — and Kubernetes charges that to
# the pod's ephemeral-storage, where going over evicts the pod instead of failing a query.
# That is the one failure ddi cannot contain from the inside, so set both in any container.
# temp_directory          = "/var/spill"
#
# Bytes of spill this whole process may hold at once. Unset it is DataFusion's own 100GB,
# which is larger than most pods' limit — so unset is not "unbounded", it is "bounded above
# the point at which the pod is killed". Set it BELOW the volume: the budget is checked after
# each write rather than before, so leave headroom.
# max_temp_directory_size = "8GB"
#
# How much memory one startup uniqueness check may hold. It writes nothing to disk however
# large the target is; what this buys is fewer passes over the key column. Eight bytes per
# target row divided by this is the number of passes, so doubling it halves them.
# max_grain_check_memory  = "512MB"

# A row the target will not take — a price that says "n/a" against a DECIMAL column — is
# written to <target_uri>__ddi_dq with the reason attached, and the rest of the batch
# commits. That table is never created here: make it, and rejects are set aside; leave it
# out, and a bad row fails the pipeline instead (which then backs off and retries rather
# than stopping the other pipelines). Set dq_uri per pipeline to put it somewhere else.
#
#   CREATE TABLE silver.orders__ddi_dq (
#     app_id VARCHAR, pipeline VARCHAR, source_version BIGINT,
#     column_name VARCHAR, reason VARCHAR, payload VARCHAR, _timestamp TIMESTAMP(6)
#   ) WITH (location = 'abfss://lake@acct.dfs.core.windows.net/silver/orders__ddi_dq')

# Header grain: one row in, one row out.
[[pipeline]]
name       = "orders_header"
# app_id is the OFFSET KEY. It must be unique across pipelines and stable forever —
# changing it replays the source from starting_version.
app_id     = "ddi.orders_header"
source_uri = "abfss://lake@acct.dfs.core.windows.net/bronze/orders"
target_uri = "abfss://lake@acct.dfs.core.windows.net/silver/orders"
starting_version = 0
# fail | skip_change_commits | ignore_changes
change_policy    = "fail"
transform_sql    = """
SELECT order_id,
       CAST(created_at AS TIMESTAMP)        AS created_at,
       customer.id                          AS customer_id,
       customer.country                     AS customer_country,
       array_length(line_items)             AS line_count,
       array_sum(line_items, 'price * qty') AS order_total
FROM source
WHERE order_status <> 'DRAFT'
"""

# Current-state grain: one row per order, not one per delivery of it.
#
# Bronze is a log — placed, then paid, then shipped, all carrying the same order_id — and
# append mode would keep all three. Upsert replaces the stored row when a newer one arrives.
# The cost: the merge reads part of the target on every batch, and the target stops being an
# append-only table, so only an upserting pipeline can read it downstream.
[[pipeline]]
name       = "orders_current"
app_id     = "ddi.orders_current"
source_uri = "abfss://lake@acct.dfs.core.windows.net/bronze/orders"
target_uri = "abfss://lake@acct.dfs.core.windows.net/silver/orders_current"
# append (default) | upsert
write_mode = "upsert"
# Which of two rows for the same key is newer. Required for upsert, and must be
# non-decreasing in the order rows reach the source.
dedup_timestamp = "_timestamp"
# What a row is matched on. Defaults to dedup_key.
upsert_key      = "order_id"
# Optional cost ceiling: never look further back than this, however far the target's file
# statistics say the window should reach. Omit it and completeness always wins — correct,
# and occasionally a full-table merge. When the floor bites, it is logged and counted in
# ddi_upsert_window_clamped_total.
upsert_lookback = "48h"

# Line-item grain: fan out from the same source into a second target.
# Individually exactly-once, but NOT mutually atomic with the pipeline above.
[[pipeline]]
name       = "orders_lines"
app_id     = "ddi.orders_lines"
source_uri = "abfss://lake@acct.dfs.core.windows.net/bronze/orders"
target_uri = "abfss://lake@acct.dfs.core.windows.net/silver/order_lines"
transform_sql = """
SELECT order_id, li.sku, li.qty, CAST(li.price AS DECIMAL(18,4)) AS price
FROM (SELECT order_id, unnest(line_items) AS li FROM source)
"""

# ---------------------------------------------------------------------------
# Realtime publication (optional).
#
# After a target commit lands, ddi can push a compact payload derived from that
# same batch to a fan-out service, so a dashboard gets updates without polling
# Delta. Delta stays authoritative; this is a best-effort fast path and is
# at-most-once. A publish that fails, times out, or never happens because the
# process died cannot affect the commit — the offset has already moved with it.
#
# What to publish is a dbt question, and is declared there:
#
#   models:
#     - name: orders_live          # a view over the streamed model
#       meta:
#         ddi_publish: webpubsub
#         ddi_publish_group: sales
#
# What is left here is the part dbt cannot know: where to send it, and how to
# authenticate. Omit this table entirely and nothing publishes, whatever the
# models ask for — which is the normal state of a dev deployment, not an error.
# Append-only pipelines only: a merge replaces the row stored under a key, so
# the committed batch does not say what the dashboard delta was.
#
# [publish]
# type = "webpubsub"
# # Name of the environment variable holding the connection string, in the form
# # Endpoint=https://<name>.webpubsub.azure.com;AccessKey=<key>;Version=1.0;
# connection_string_env = "DDI_WEBPUBSUB_CONNECTION"
# hub = "ddi"
# message_ttl_secs   = 60      # 0..=300; a stale live delta is worse than none
# timeout_secs       = 5       # a slow publish is already useless to a dashboard
# failure_threshold  = 5       # consecutive failures before the breaker opens
# breaker_cooldown_secs = 30
# max_message_bytes  = "900KB" # the service's frame limit is 1 MB
